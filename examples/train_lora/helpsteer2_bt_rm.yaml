### model
model_name_or_path: /workspace/model/chat_model/Qwen2.5-7B-Instruct
trust_remote_code: true

### method
stage: rm
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all

### dataset
dataset: helpsteer2_bt_train
template: qwen
cutoff_len: 4096
val_size: 0.05
preprocessing_num_workers: 16

### output
output_dir: saves/helpsteer2/bt-rm
run_name: helpsteer2_bt_rm_lora_r16
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true
report_to: wandb

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
do_eval: true
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 50
