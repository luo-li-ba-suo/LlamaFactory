### model
model_name_or_path: ../../model/Qwen3-8B
trust_remote_code: true

### method
stage: sfl
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all

### sfl
sfl_score_tokens: "0,1"
sfl_prefix_str: '{"score": '
sfl_temperature: 5.0

### dataset
dataset: helpsteer3_multilingual_sfl_binary_train
eval_dataset: helpsteer3_sfl_binary_eval_multilingual
# Qwen3 non-thinking mode: insert an empty <think></think> prefix.
template: qwen3
enable_thinking: false
cutoff_len: 4096
preprocessing_num_workers: 16

### output
output_dir: saves/helpsteer3/sfl-binary-multilingual-qwen3-8b
run_name: helpsteer3_sfl_binary_multilingual_qwen3_8b_lora_r16
logging_steps: 10
save_steps: 200
save_strategy: steps
plot_loss: true
overwrite_output_dir: true
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
do_eval: true
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 16
