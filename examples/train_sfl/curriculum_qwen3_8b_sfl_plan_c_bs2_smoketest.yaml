### One-step OOM smoke test for the Plan C Qwen3-8B SfL setup.
### This intentionally uses the original micro-batch of 2.
model_name_or_path: ../../model/Qwen3-8B
trust_remote_code: true

stage: sfl
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all

sfl_score_tokens: "0,1"
sfl_prefix_str: '{"score": '
sfl_temperature: 5.0

dataset: curriculum_qwen3_sfl_plan_c_long4096_smoketest
template: qwen3
enable_thinking: false
cutoff_len: 4096
max_samples: 256
preprocessing_num_workers: 16

output_dir: saves/tests/qwen3-8b-sfl-plan-c-bs2-smoketest
overwrite_output_dir: true
logging_steps: 1
save_strategy: "no"
plot_loss: false
report_to: none

per_device_train_batch_size: 2
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
max_steps: 1
bf16: true
ddp_timeout: 180000000

do_eval: false
