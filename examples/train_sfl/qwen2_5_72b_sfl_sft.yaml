### model
model_name_or_path: Qwen/Qwen2.5-72B-Instruct
trust_remote_code: true

### method
stage: sfl
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all
deepspeed: examples/deepspeed/ds_z3_config.json

### sfl params
sfl_score_tokens: "0,1"  # 二分类 0-1；多分类用 "1,2,3,4,5"
sfl_prefix_str: '{"score": '  # prefix 字符串（仅日志用）
sfl_temperature: 5.0  # 仅多分类生效

### dataset
dataset: your_pairwise_data
template: qwen
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen2.5-72b/sfl-sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
